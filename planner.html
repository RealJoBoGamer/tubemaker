<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeMaker Journey Planner</title>
  <meta name="description" content="Plan a journey on the full London map – Tube, DLR, Elizabeth line, Overground, Thameslink, Trams and the Cable Car – and see just your route.">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/planner.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23dc241f' stroke-width='6'/%3E%3Crect x='1' y='12.5' width='30' height='7' fill='%231c2c6b'/%3E%3C/svg%3E">
</head>
<body class="editor planner">
<header class="topbar">
  <a class="brand" href="index.html" title="TubeMaker">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="#dc241f" stroke-width="5.5"/><rect x="1" y="12.6" width="30" height="6.8" fill="#1c2c6b"/></svg>
    <span>Journey Planner</span>
  </a>
  <nav class="actions">
    <a class="btn" href="index.html">Map builder</a>
    <a class="btn" href="community.html">Community</a>
  </nav>
</header>

<div class="workspace">
  <aside class="panel left planner-panel">
    <form id="planForm" autocomplete="off">
      <label class="field"><span>From</span>
        <input id="from" type="text" list="stationList" placeholder="Station name" required>
      </label>
      <button type="button" class="swap" id="swap" title="Swap">⇅</button>
      <label class="field"><span>To</span>
        <input id="to" type="text" list="stationList" placeholder="Station name" required>
      </label>
      <div class="row2">
        <label class="field"><span>When</span>
          <select id="when"><option value="now">Leave now</option><option value="depart">Depart at</option><option value="arrive">Arrive by</option></select>
        </label>
        <label class="field"><span>Time</span><input id="time" type="time"></label>
      </div>
      <label class="field"><span>Prefer</span>
        <select id="prefer">
          <option value="leasttime">Fastest</option>
          <option value="leastinterchange">Fewest changes</option>
          <option value="leastwalking">Least walking</option>
        </select>
      </label>
      <details class="modes">
        <summary>Modes</summary>
        <div id="modeList" class="mode-list"></div>
      </details>
      <label class="check"><input type="checkbox" id="stepFree"> Step-free journeys only</label>
      <label class="check"><input type="checkbox" id="useTfl" checked> Live TfL journey planner (unticked: plan on the map only)</label>
      <button class="btn primary wide" type="submit">Plan journey</button>
    </form>
    <datalist id="stationList"></datalist>
    <div id="results" class="results"></div>
  </aside>

  <main class="canvas-wrap" id="canvasWrap" data-tool="pan">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="viewport"></g></svg>
    <div class="map-toggle">
      <button class="btn small" id="showAll" hidden>Show full map</button>
      <label class="check small" id="fadeRow" hidden><input type="checkbox" id="fadeRest"> Faint rest of network</label>
    </div>
    <div class="zoom-controls">
      <button data-zoom="1.25" title="Zoom in">+</button>
      <button data-zoom="0.8" title="Zoom out">−</button>
      <button data-zoom="fit" title="Fit">⤢</button>
    </div>
  </main>
</div>
<footer class="statusbar"><span id="status">Loading map…</span><span class="spacer"></span><span class="muted small">Journey data: TfL Unified API · Map: TfL large print Tube map</span></footer>
<div id="toast" class="toast" hidden></div>
<div id="loadError" class="load-error" hidden></div>
<script>
  // Show problems on the page instead of failing silently.
  window.addEventListener('error', function (e) {
    var box = document.getElementById('loadError');
    box.hidden = false;
    box.textContent = 'The planner hit an error: ' + (e.message || e) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var box = document.getElementById('loadError');
    box.hidden = false;
    box.textContent = 'The planner hit an error: ' + ((e.reason && e.reason.message) || e.reason);
  });
</script>

<script src="assets/js/template-full.js"></script>
<script src="assets/js/tfl-symbols.js"></script>
<script src="assets/js/symbols.js"></script>
<script src="assets/js/doc.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/planner.js"></script>
<script>
  if (!window.TUBE_TEMPLATE_FULL || !window.TubePlanner) {
    var box = document.getElementById('loadError');
    if (box.hidden) {
      box.hidden = false;
      box.textContent = 'The map script could not be loaded. Unzip everything first and keep index.html, styles.css and app.js together in the same folder, then open index.html.';
    }
  }
</script>
</body>
</html>
